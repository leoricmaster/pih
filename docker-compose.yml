# 工程脚手架本地环境（架构 §3 容器视图）
# 三服务：postgres+pgvector / minio / app
# 说明：中文分词扩展（zhparser/pg_jieba）留到 M1 全文检索 Sprint 单独验证镜像选型，
#       本 Sprint 仅验 pgvector 扩展可用。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pih}
      POSTGRES_USER: ${POSTGRES_USER:-pih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pih}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pih}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pih}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pih12345}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
    volumes:
      # dev 热重载
      - ./src:/app/src:ro
      - ./domain_packs:/app/domain_packs:ro
      - ./tests:/app/tests:ro
    command: sleep infinity

  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      # 容器内连 PG 用 postgres 主机名（覆盖 .env 的 localhost）
      PG_DSN: postgresql://pih:pih@postgres:5432/${POSTGRES_DB:-pih}
      # 容器内连 MinIO 用 minio 主机名（presigned URL 同 host，浏览器不可达时降级展示 ID）
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./src:/app/src:ro
    command: uvicorn pih.consume.web:app --host 0.0.0.0 --port 8000
    ports:
      - "${PIH_WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
