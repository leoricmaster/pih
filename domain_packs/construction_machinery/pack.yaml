  # {domain} 情报周报
  周期：{period}
  汇总 {count} 条情报，按事件类型与主体分布如下……
  （模板由领域包提供，渲染逻辑在报告服务实现）

# ---- 抽取提示词（实测终版 v3 工程化：占位符注入 + 信息可信度键）----
# 占位符由 process 层注入：<事件类型>←event_types、<标签树>←tag_tree 叶子、
# <主体清单>←competitors（display_name + aliases）；缺 token 领域包加载被拒。
extraction_prompt: |
  你是竞品情报抽取器。从给定正文中抽取结构化情报，严格输出如下 JSON（字段名与结构不可变）：
  {"主体": "公司或机构名", "事件类型": "从以下枚举选一：<事件类型>",
   "事实描述": "客观事实陈述，仅摘录正文含数字的原文句子，用分号串联，不增删一字",
   "推断与判断": "正文可支撑的简明推断，以'依据：'开头，仅一句，不超过40字；无推断留空字符串",
   "标签": ["从以下标签树选 0–4 个：<标签树>"],
   "量化参数": {"参数名": "数值+单位"},
   "信息可信度": "1–6 单字符，判据见规则 8"}

  严格规则：
  1. 只依据正文，不引入外部知识；正文与领域无关时事件类型选"其他"、标签为空数组。
  2. "主体"优先从主体清单对齐规范名（命中别名映射到规范名）；清单未收录的写公司全名，不加"中国"前缀；行业整体统计写"工程机械行业"或具体行业名。主体清单：<主体清单>
  3. "事实描述"必须从原文摘录原句（可截取含数字的子句），不得改写、不得添加评价；多个事实用"；"分隔。
  4. "量化参数"的 key 用最简短参数名（如"营收"、"营收同比"、"出口额"），不带年份前缀、不带"同比增长"后缀；value 保留原文数字与单位；无量化数据给空对象 {}。
  5. "推断与判断"只给一条最核心推断，以"依据："开头，≤40字。
  6. 标签必须从标签树的完整词中选取，不得改写（如"场景-矿山"而非"场景（矿山）"）。
  7. "量化参数"与"信息可信度"必须始终输出，即使为空。
  8. "信息可信度"按 Admiralty 信息可信度词表评级（1–6 单字符）：
     1=官方证实或一手数据；2=权威媒体确认；3=单一可靠来源、未获证实；
     4=转述或推测成分明显；5=匿名或传闻来源；6=无法判断。

# ---- 排序权重（§6.2，可选；缺省由核心代码给默认，此处显式落盘与文档一致）----
ranking:
  reliability_weights:
    A: 1.0
    B: 0.8
    C: 0.6
    D: 0.4
    E: 0.2
    F: 0.0
  credibility_weights:
    "1": 1.0
    "2": 0.8
    "3": 0.6
    "4": 0.4
    "5": 0.2
    "6": 0.0
  event_state_weights:
    confirmed: 1.0
    single_source: 0.8
    pending: 0.5
    refuted: 0.0
    expired: 0.3
