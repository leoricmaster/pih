# ---- 报告模板（Sprint 1 占位，M2 报告服务 Sprint 细化）----
report_template: |
  # {domain} 情报周报
  周期：{period}
  汇总 {count} 条情报，按事件类型与主体分布如下……
  （模板由领域包提供，渲染逻辑在 M2 报告服务实现）

# ---- 抽取提示词（Sprint 1 占位，生产期按 SPK-2 结论改 few-shot + 语义评分）----
# SPK-2 结论：结构化字段（枚举/标签）为主、自由文本为辅；评分改语义相似度。
extraction_prompt: |
  从工程机械情报原文抽取以下字段（SPK-2 §字段结构）：
  - 主体：竞品主体（命中 competitors.aliases 优先）
  - 事件类型：枚举 11 类（新品发布/功能迭代/中标落地/行业统计/行业合作/财报/标准动态/其他）
  - 事实描述：客观事实陈述
  - 标签：命中 tag_tree
  - 推断与判断：分析推断（须与事实分离）
  - 量化参数：数值参数（销量/金额/增长率等）
  （Sprint 1 占位提示词，生产期按 SPK-2 few-shot 锚定金答案风格）

# ---- 排序权重（§6.2，可选；缺省由核心代码给默认，此处显式落盘与文档一致）----
ranking:
  reliability_weights:
    A: 1.0
    B: 0.8
    C: 0.6
    D: 0.4
    E: 0.2
    F: 0.0
  credibility_weights:
    "1": 1.0
    "2": 0.8
    "3": 0.6
    "4": 0.4
    "5": 0.2
    "6": 0.0
  event_state_weights:
    confirmed: 1.0
    single: 0.8
    pending: 0.5
    refuted: 0.0
