# 领域包：工程机械（第一领域）
# 事实源依据：信源实测锁定清单（9 ≤ 10，本文件即信源清单事实源；实测结论见 Architecture §3 信源摸底）
#             事件类型枚举 11 类 + 字段结构（抽取实测沉淀，机制见 Architecture §6.3 领域包）
# 状态：v0.2.0——event_types 节落盘（枚举单一事实源从金答案脚本移入配置）、
#             extraction_prompt 正式化（实测 v3 工程化版 + 信息可信度键 + 占位符注入）；
#             落盘信源为纸面锁定值，采集适配器接入后按实测调 reliability。

meta:
  domain_id: construction_machinery
  display_name: 工程机械
  version: 0.2.0

# ---- 信源清单（实测锁定 9 源，信源摸底结论见 Architecture §3）----
# reliability（Admiralty 来源可靠性 A–F，官方分档见 doc-2 §6.3 / doc-4 术语词表）：
#   赋值只经两途——注册人按官方定义人工初评；核实历史结局（verification_log）驱动画像重估。
#   现值为信源摸底期人工初评，待画像机制上线后重估。
# level（信息层级，定义见 doc-2 §6.3）：L1 官方/主机厂、L2 权威/垂直媒体、L3 聚合、L4 弱信号
# fetch_frequency：调度器（Backlog TASK-4.01.01）消费；当前仅落盘
# enabled 门控（TASK-1.01.01 AC2「成功才允许启用」）：
#   新增信源 enabled: false → 运行 `pih probe-source <id>` 试抓取 → 通过后由
#   运营者人工置 true（工具不改 YAML，人是最终环节）；collect 仅运行 enabled 源。
#   ccma/sany/cehome 三源实抓 6/6 通过（2026-08-25）置 true；
#   其余 6 源待适配器接入并试抓取通过后置 true。
