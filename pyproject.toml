[project]
name = "pih"
version = "0.1.0"
description = "产品情报中心——采集→核实→结构化→存储→消费的情报流水线"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "lancer" }]

# 生产期依赖：collect 层（httpx+selectolax+minio）；process 层（langgraph+openai）；
# consume 层（fastapi+uvicorn+jinja2，Sprint 5a）
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "minio>=7.2",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "langgraph>=0.2",
    "psycopg[binary,pool]>=3.3.4",
    "alembic>=1.19.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
pih = "pih.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pih"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需 docker-compose up 的集成测试",
]
# src-layout 下让 pytest 找到包
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 惯例：Query/Depends 在参数默认值调用（B008 误报）
"src/pih/consume/web.py" = ["B008"]
"src/pih/consume/api.py" = ["B008"]
