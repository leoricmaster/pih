[project]
name = "pih"
version = "0.1.0"
description = "产品情报中心——采集→核实→结构化→存储→消费的情报流水线"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "lancer" }]

# 生产期依赖：从 spike/requirements.txt 继承核心栈；业务模块后续 Sprint 按需追加
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pih"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需 docker-compose up 的集成测试",
]
# src-layout 下让 pytest 找到包
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
